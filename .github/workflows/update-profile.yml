name: Update profile stats

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'profile.json'
      - 'update_profile.py'
      - 'tests/**'
      - 'assets/portrait.txt'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test statistics calculation
        run: python -m unittest discover -s tests -v
      - name: Refresh cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_profile.py
      - name: Commit refreshed cards
        run: |
          git add assets/profile-dark.svg assets/profile-light.svg assets/activity-dark.svg assets/activity-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile activity'
          git push
